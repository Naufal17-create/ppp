<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgFin)"/>
  
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1e293b"/>
  <circle cx="42" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="38" r="5" fill="#10b981"/>
  <text x="100" y="42" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif">FinVault // Personal Wealth Manager</text>

  <!-- Credit Card / Balance Widget -->
  <g transform="translate(45, 75)">
    <rect width="240" height="135" rx="12" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="20" y="32" fill="#bfdbfe" font-size="11" font-family="sans-serif">Total Balance</text>
    <text x="20" y="65" fill="#ffffff" font-size="22" font-weight="bold" font-family="sans-serif">Rp 84.750.000</text>
    <text x="20" y="115" fill="#dbeafe" font-size="11" font-family="monospace">•••• 9402 | EXP 08/28</text>
    <circle cx="205" cy="40" r="14" fill="#f59e0b" opacity="0.8"/>
    <circle cx="190" cy="40" r="14" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- Pie / Expense Breakdown -->
  <g transform="translate(315, 75)">
    <rect width="240" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="12" font-weight="bold" font-family="sans-serif">Monthly Allocation</text>
    <circle cx="70" cy="80" r="38" fill="none" stroke="#3b82f6" stroke-width="14" stroke-dasharray="140, 100"/>
    <circle cx="70" cy="80" r="38" fill="none" stroke="#10b981" stroke-width="14" stroke-dasharray="60, 180" stroke-dashoffset="-140"/>
    <circle cx="70" cy="80" r="38" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="40, 200" stroke-dashoffset="-200"/>

    <text x="135" y="65" fill="#93c5fd" font-size="10" font-family="sans-serif">■ Needs (50%)</text>
    <text x="135" y="85" fill="#6ee7b7" font-size="10" font-family="sans-serif">■ Savings (30%)</text>
    <text x="135" y="105" fill="#fcd34d" font-size="10" font-family="sans-serif">■ Wants (20%)</text>
  </g>

  <!-- Recent Transactions List -->
  <g transform="translate(45, 230)">
    <rect width="510" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Row 1 -->
    <circle cx="28" cy="28" r="12" fill="#065f46"/>
    <text x="24" y="32" fill="#34d399" font-size="12">↓</text>
    <text x="50" y="32" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif">Client Project Payment</text>
    <text x="415" y="32" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">+Rp 15.000.000</text>

    <!-- Row 2 -->
    <circle cx="28" cy="62" r="12" fill="#7f1d1d"/>
    <text x="24" y="66" fill="#f87171" font-size="12">↑</text>
    <text x="50" y="66" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif">Cloud Server Infrastructure</text>
    <text x="425" y="66" fill="#f87171" font-size="11" font-weight="bold" font-family="sans-serif">-Rp 850.000</text>
  </g>
</svg>