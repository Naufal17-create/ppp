    <text x="15" y="110" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif">IDR 499.000</text>
    <rect x="115" y="100" width="35" height="20" rx="4" fill="#10b981"/>
    <text x="127" y="114" fill="#ffffff" font-size="11" font-family="sans-serif">+</text>

    <!-- Card 2 -->
    <g transform="translate(182, 0)">
      <rect width="165" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="12" width="135" height="65" rx="6" fill="#0f172a"/>
      <circle cx="82" cy="45" r="22" fill="#ec4899" opacity="0.6"/>
      <text x="15" y="94" fill="#f1f5f9" font-size="11" font-weight="bold" font-family="sans-serif">Aero Utility Cargo</text>
      <text x="15" y="110" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif">IDR 389.000</text>
      <rect x="115" y="100" width="35" height="20" rx="4" fill="#10b981"/>
      <text x="127" y="114" fill="#ffffff" font-size="11" font-family="sans-serif">+</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(365, 0)">
      <rect width="165" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="12" width="135" height="65" rx="6" fill="#0f172a"/>
      <circle cx="82" cy="45" r="22" fill="#8b5cf6" opacity="0.6"/>
      <text x="15" y="94" fill="#f1f5f9" font-size="11" font-weight="bold" font-family="sans-serif">Modular Sling Bag</text>
      <text x="15" y="110" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif">IDR 249.000</text>
      <rect x="115" y="100" width="35" height="20" rx="4" fill="#10b981"/>
      <text x="127" y="114" fill="#ffffff" font-size="11" font-family="sans-serif">+</text>
