<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgEcom)"/>
  
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1e293b"/>
  <circle cx="42" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="38" r="5" fill="#10b981"/>
  <text x="100" y="42" fill="#e2e8f0" font-size="12" font-weight="bold" font-family="sans-serif">URBANPULSE // STORE</text>
  
  <!-- Banner Hero -->
