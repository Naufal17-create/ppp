    <text x="30" y="65" fill="#94a3b8" font-size="12" font-family="sans-serif">Minimalist, durable, water-resistant everyday essentials.</text>
    <rect x="30" y="75" width="100" height="24" rx="6" fill="url(#btnGrad)"/>
    <text x="50" y="91" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">SHOP NOW</text>

