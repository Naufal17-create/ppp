<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bg)"/>
  
  <!-- Browser Chrome / Top Bar -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1f2937"/>
  <circle cx="42" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="38" r="5" fill="#10b981"/>
  <rect x="110" y="28" width="220" height="20" rx="6" fill="#374151"/>
  <text x="125" y="42" fill="#9ca3af" font-size="11" font-family="sans-serif">nexus-analytics.io/live-board</text>
  
  <!-- Sidebar -->
  <rect x="20" y="56" width="90" height="284" fill="#0f172a" opacity="0.6"/>
  <rect x="32" y="75" width="66" height="12" rx="4" fill="#6366f1"/>
  <rect x="32" y="105" width="55" height="8" rx="3" fill="#4b5563"/>
  <rect x="32" y="125" width="60" height="8" rx="3" fill="#4b5563"/>
  <rect x="32" y="145" width="45" height="8" rx="3" fill="#4b5563"/>

  <!-- Metric Cards -->
  <g transform="translate(125, 75)">
    <rect width="135" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="12" y="22" fill="#9ca3af" font-size="10" font-family="sans-serif">Total Revenue</text>
    <text x="12" y="45" fill="#f3f4f6" font-size="16" font-weight="bold" font-family="sans-serif">$124,580</text>
    <rect x="85" y="12" width="38" height="16" rx="4" fill="#065f46"/>
    <text x="91" y="24" fill="#34d399" font-size="9" font-family="sans-serif">+18.4%</text>
  </g>

  <g transform="translate(275, 75)">
    <rect width="135" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="12" y="22" fill="#9ca3af" font-size="10" font-family="sans-serif">Active Users</text>
    <text x="12" y="45" fill="#f3f4f6" font-size="16" font-weight="bold" font-family="sans-serif">48.2k</text>
    <rect x="85" y="12" width="38" height="16" rx="4" fill="#065f46"/>
    <text x="91" y="24" fill="#34d399" font-size="9" font-family="sans-serif">+32.1%</text>
  </g>

  <g transform="translate(425, 75)">
    <rect width="135" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="12" y="22" fill="#9ca3af" font-size="10" font-family="sans-serif">Server Health</text>
    <text x="12" y="45" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif">99.98%</text>
    <circle cx="115" cy="40" r="5" fill="#10b981"/>
  </g>

  <!-- Big Analytics Area Chart -->
  <g transform="translate(125, 150)">
    <rect width="285" height="170" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="16" y="25" fill="#f3f4f6" font-size="12" font-weight="bold" font-family="sans-serif">Revenue Growth Realtime</text>
    
    <!-- Chart Grid -->
    <line x1="20" y1="50" x2="265" y2="50" stroke="#374151" stroke-dasharray="3,3"/>
    <line x1="20" y1="90" x2="265" y2="90" stroke="#374151" stroke-dasharray="3,3"/>
    <line x1="20" y1="130" x2="265" y2="130" stroke="#374151" stroke-dasharray="3,3"/>
    
    <!-- Area Path -->
    <path d="M 20 120 Q 70 100, 110 70 T 180 50 T 265 35 L 265 140 L 20 140 Z" fill="url(#chartGrad)"/>
    <path d="M 20 120 Q 70 100, 110 70 T 180 50 T 265 35" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="180" cy="50" r="4" fill="#a5b4fc" stroke="#6366f1" stroke-width="2"/>
    <circle cx="265" cy="35" r="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Bar Breakdown Chart -->
  <g transform="translate(425, 150)">
    <rect width="135" height="170" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="14" y="25" fill="#f3f4f6" font-size="12" font-weight="bold" font-family="sans-serif">Traffic Split</text>
    
    <!-- Bars -->
    <rect x="25" y="80" width="18" height="60" rx="4" fill="url(#bar1)"/>
    <text x="34" y="153" fill="#9ca3af" font-size="9" text-anchor="middle" font-family="sans-serif">Direct</text>
    
    <rect x="58" y="55" width="18" height="85" rx="4" fill="url(#bar2)"/>
    <text x="67" y="153" fill="#9ca3af" font-size="9" text-anchor="middle" font-family="sans-serif">Social</text>

    <rect x="91" y="95" width="18" height="45" rx="4" fill="#06b6d4"/>
    <text x="100" y="153" fill="#9ca3af" font-size="9" text-anchor="middle" font-family="sans-serif">Organic</text>
  </g>
</svg>