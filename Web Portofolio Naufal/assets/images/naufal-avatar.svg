<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#accentGlow)" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="150" fill="url(#bgGrad)" stroke="url(#accentGlow)" stroke-width="4"/>

  <!-- Code Grid Pattern Behind -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="120" x2="320" y2="120" />
    <line x1="80" y1="160" x2="320" y2="160" />
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="80" y1="240" x2="320" y2="240" />
    <line x1="120" y1="80" x2="120" y2="320" />
    <line x1="160" y1="80" x2="160" y2="320" />
    <line x1="200" y1="80" x2="200" y2="320" />
    <line x1="240" y1="80" x2="240" y2="320" />
    <line x1="280" y1="80" x2="280" y2="320" />
  </g>

  <!-- Developer Silhouette / Character Body -->
  <!-- Shoulders / Hoodie -->
  <path d="M 100 350 C 100 270, 140 250, 200 250 C 260 250, 300 270, 300 350 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Hoodie inner neckline -->
  <path d="M 160 250 Q 200 290 240 250 Q 200 310 160 250 Z" fill="#1e293b"/>
  
  <!-- Neck -->
  <rect x="180" y="210" width="40" height="50" rx="8" fill="url(#skinGrad)" opacity="0.95"/>
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)"/>

  <!-- Modern Hair Style -->
  <path d="M 145 170 C 145 110, 180 100, 220 105 C 255 110, 260 135, 255 165 C 245 130, 210 120, 165 140 C 150 148, 145 160, 145 170 Z" fill="#0f172a"/>
  
  <!-- Smart Glasses / Tech Specs -->
  <rect x="155" y="165" width="38" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <rect x="207" y="165" width="38" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <line x1="193" y1="178" x2="207" y2="178" stroke="#38bdf8" stroke-width="3"/>
  <line x1="145" y1="175" x2="155" y2="178" stroke="#38bdf8" stroke-width="2"/>
  <line x1="245" y1="178" x2="255" y2="175" stroke="#38bdf8" stroke-width="2"/>

  <!-- Glasses Reflection Glow -->
  <line x1="160" y1="185" x2="175" y2="170" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="212" y1="185" x2="227" y2="170" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Friendly Smile -->
  <path d="M 185 212 Q 200 224 215 212" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Headphone Band Over Head -->
  <path d="M 135 180 A 68 68 0 0 1 265 180" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <!-- Ear Cups -->
  <rect x="130" y="165" width="14" height="35" rx="7" fill="#818cf8"/>
  <rect x="256" y="165" width="14" height="35" rx="7" fill="#818cf8"/>

  <!-- Floating Tech Badges / Sparks -->
  <g transform="translate(60, 90)">
    <circle cx="15" cy="15" r="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="15" y="20" fill="#a5b4fc" font-size="13" font-family="monospace" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
  </g>
  <g transform="translate(300, 110)">
    <circle cx="15" cy="15" r="16" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
    <text x="15" y="21" fill="#67e8f9" font-size="14" text-anchor="middle">⚡</text>
  </g>
  <g transform="translate(305, 230)">
    <circle cx="15" cy="15" r="16" fill="#1e1b4b" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="21" fill="#34d399" font-size="14" text-anchor="middle">🚀</text>
  </g>
</svg>
