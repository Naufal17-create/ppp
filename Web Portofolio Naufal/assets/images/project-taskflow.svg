<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgTask)"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1e293b"/>
  <circle cx="42" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="38" r="5" fill="#10b981"/>
  <text x="100" y="42" fill="#cbd5e1" font-size="12" font-weight="bold" font-family="sans-serif">TaskFlow // Sprint Board</text>

  <!-- 3 Kanban Columns -->
  <!-- Col 1: To Do -->
  <g transform="translate(35, 75)">
    <rect width="165" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">TO DO (2)</text>
    <!-- Card 1 -->
    <rect x="10" y="38" width="145" height="65" rx="6" fill="#0f172a"/>
    <rect x="18" y="48" width="45" height="14" rx="3" fill="#6366f1"/>
    <text x="24" y="58" fill="#ffffff" font-size="8" font-family="sans-serif">DESIGN</text>
    <text x="18" y="78" fill="#e2e8f0" font-size="10" font-family="sans-serif">Revamp Landing Page</text>
    <!-- Card 2 -->
    <rect x="10" y="112" width="145" height="65" rx="6" fill="#0f172a"/>
    <rect x="18" y="122" width="45" height="14" rx="3" fill="#ec4899"/>
    <text x="24" y="132" fill="#ffffff" font-size="8" font-family="sans-serif">URGENT</text>
    <text x="18" y="152" fill="#e2e8f0" font-size="10" font-family="sans-serif">Fix Auth Token Expiry</text>
  </g>

  <!-- Col 2: In Progress -->
  <g transform="translate(218, 75)">
    <rect width="165" height="245" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">IN PROGRESS (1)</text>
    <!-- Active Card -->
    <rect x="10" y="38" width="145" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <rect x="18" y="48" width="55" height="14" rx="3" fill="#0284c7"/>
    <text x="24" y="58" fill="#ffffff" font-size="8" font-family="sans-serif">BACKEND</text>
    <text x="18" y="78" fill="#f8fafc" font-size="10" font-weight="bold" font-family="sans-serif">Prisma DB Migration</text>
    <rect x="18" y="95" width="125" height="6" rx="3" fill="#334155"/>
    <rect x="18" y="95" width="85" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Col 3: Done -->
  <g transform="translate(400, 75)">
    <rect width="165" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">COMPLETED (3)</text>
    <rect x="10" y="38" width="145" height="55" rx="6" fill="#0f172a"/>
    <text x="18" y="60" fill="#94a3b8" font-size="10" font-family="sans-serif">✔ Setup Docker CI/CD</text>
    <rect x="10" y="102" width="145" height="55" rx="6" fill="#0f172a"/>
    <text x="18" y="124" fill="#94a3b8" font-size="10" font-family="sans-serif">✔ Optimize Bundle Size</text>
  </g>
