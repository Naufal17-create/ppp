<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#synthGrad)"/>
  <!-- Retrowave Sun -->
  <circle cx="150" cy="120" r="65" fill="url(#sunGrad)"/>
  <line x1="85" y1="110" x2="215" y2="110" stroke="#0f172a" stroke-width="4"/>
  <line x1="90" y1="125" x2="210" y2="125" stroke="#0f172a" stroke-width="6"/>
  <line x1="95" y1="145" x2="205" y2="145" stroke="#0f172a" stroke-width="8"/>
  <line x1="105" y1="170" x2="195" y2="170" stroke="#0f172a" stroke-width="10"/>
  <!-- Grid Horizon -->
  <polygon points="0,185 300,185 300,300 0,300" fill="#090d16"/>
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.7">
    <line x1="150" y1="185" x2="150" y2="300" />
    <line x1="150" y1="185" x2="70" y2="300" />
    <line x1="150" y1="185" x2="230" y2="300" />
    <line x1="150" y1="185" x2="0" y2="280" />
    <line x1="150" y1="185" x2="300" y2="280" />
    <line x1="0" y1="200" x2="300" y2="200" />
    <line x1="0" y1="225" x2="300" y2="225" />
    <line x1="0" y1="260" x2="300" y2="260" />
  </g>
  <text x="150" y="45" font-family="sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">NEON SYNTHWAVE</text>
</svg>