<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgAgency)"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Subtle Elegant Radial Circles -->
  <circle cx="480" cy="180" r="140" fill="#fde047" opacity="0.08" filter="blur(30px)"/>
  
  <text x="60" y="90" fill="#a1a1aa" font-size="12" font-family="sans-serif" letter-spacing="4">STUDIO AURA // CREATIVE LAB</text>
  <text x="60" y="150" fill="#ffffff" font-size="34" font-weight="900" font-family="sans-serif">WE ELEVATE</text>
  <text x="60" y="195" fill="url(#goldGrad)" font-size="34" font-weight="900" font-family="sans-serif">DIGITAL LUXURY.</text>
  <text x="60" y="240" fill="#71717a" font-size="13" font-family="sans-serif">Bespoke websites &amp; interactive identities for visionary brands.</text>
  
  <!-- Interactive Pill Button -->
  <rect x="60" y="265" width="150" height="38" rx="19" fill="#fafafa"/>
  <text x="95" y="289" fill="#09090b" font-size="11" font-weight="bold" font-family="sans-serif">EXPLORE CASE</text>
  <circle cx="185" cy="284" r="9" fill="#09090b"/>
  <text x="182" y="288" fill="#ffffff" font-size="11">→</text>

  <!-- Geometric Abstract 3D Ribbon Art -->
  <path d="M 400 80 Q 480 120 440 220 T 520 280" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="440" cy="220" r="30" fill="none" stroke="#eab308" stroke-width="2" opacity="0.4"/>
</svg>