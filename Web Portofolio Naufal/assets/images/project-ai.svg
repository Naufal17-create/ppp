<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgAI)"/>
  
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#4c1d95" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="36" rx="12" fill="#1f2937"/>
  <circle cx="42" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="74" cy="38" r="5" fill="#10b981"/>
  <text x="100" y="42" fill="#d8b4fe" font-size="12" font-weight="bold" font-family="sans-serif">✨ NovaAI Code Studio</text>
  
  <!-- Left chat bubble (User) -->
  <g transform="translate(45, 75)">
    <rect width="380" height="45" rx="8" fill="#1e293b"/>
    <text x="15" y="26" fill="#e2e8f0" font-size="11" font-family="sans-serif">"Buatkan custom hook React untuk infinite scroll dengan TypeScript"</text>
  </g>

  <!-- Right AI Response (Code Block) -->
  <g transform="translate(45, 135)">
    <rect width="510" height="140" rx="10" fill="#090d16" stroke="#581c87" stroke-width="1.5"/>
    <rect width="510" height="28" rx="10" fill="#1e1b4b"/>
    <circle cx="18" cy="14" r="4" fill="#a855f7"/>
    <text x="32" y="18" fill="#e9d5ff" font-size="11" font-family="monospace">useInfiniteScroll.ts</text>
    <rect x="440" y="6" width="60" height="18" rx="4" fill="#6b21a8"/>
    <text x="455" y="18" fill="#f3e8ff" font-size="9" font-family="sans-serif">Copy Code</text>

    <!-- Code Lines -->
    <text x="20" y="55" fill="#f43f5e" font-size="11" font-family="monospace">import</text>
    <text x="65" y="55" fill="#e2e8f0" font-size="11" font-family="monospace">{ useState, useEffect, useRef } </text>
    <text x="270" y="55" fill="#f43f5e" font-size="11" font-family="monospace">from</text>
    <text x="305" y="55" fill="#38bdf8" font-size="11" font-family="monospace">'react'</text>

    <text x="20" y="80" fill="#818cf8" font-size="11" font-family="monospace">export const</text>
    <text x="105" y="80" fill="#fbbf24" font-size="11" font-family="monospace">useInfiniteScroll</text>
    <text x="215" y="80" fill="#e2e8f0" font-size="11" font-family="monospace">= (callback: () =&gt; void) =&gt; {</text>

    <text x="40" y="105" fill="#4ade80" font-size="11" font-family="monospace">// IntersectionObserver logic here</text>
    <text x="40" y="125" fill="#a855f7" font-size="11" font-family="monospace">return</text>
    <text x="85" y="125" fill="#e2e8f0" font-size="11" font-family="monospace">{ targetRef, isLoading };</text>
  </g>

  <!-- Prompt input bar -->
  <g transform="translate(45, 290)">
    <rect width="510" height="38" rx="8" fill="#1e293b" stroke="#4c1d95" stroke-width="1"/>
    <text x="18" y="24" fill="#94a3b8" font-size="11" font-family="sans-serif">Ketik prompt instruksi atau perbaikan kode...</text>
    <circle cx="485" cy="19" r="12" fill="url(#aiGlow)"/>
    <text x="480" y="23" fill="#ffffff" font-size="12">➔</text>
  </g>
</svg>